<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>添加当前标签页</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="hidden">
  <noscript><div class="empty">请启用 JavaScript 后使用</div></noscript>
  <div class="header"><div class="title">我的书签</div></div>
  <nav class="bookmark-menu" aria-label="书签菜单">
    <div id="addBookmarkMenu" class="menu-item menu-parent" tabindex="0">
      <span id="addBookmarkLabel">添加书签</span><span class="menu-arrow">›</span>
      <div id="bookmarkFolderMenu" class="menu-submenu"></div>
    </div>
    <button id="btnOpenLeftSidebar" type="button" class="menu-item">在左侧栏显示所有书签</button>
    <button id="btnOpenRightSidebar" type="button" class="menu-item">在右侧栏显示所有书签</button>
  </nav>

  <section id="popupBookmarks" class="popup-bookmarks" aria-labelledby="popupBookmarksTitle">
    <div id="popupBookmarksTitle" class="popup-bookmarks-title">所有书签</div>
    <div id="popupBookmarkList" class="popup-bookmark-list" role="list"></div>
  </section>

  <div id="empty" class="empty hidden">未获取到当前标签页</div>

  <script type="module" src="popup.js"></script>
</body>
</html>
