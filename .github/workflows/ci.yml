name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          # lockfile 里的 resolved 地址指向国内镜像（mirrors.cloud.tencent.com），
          # GitHub runner 在海外，访问常超时，导致 @biomejs/cli-linux-x64 这类
          # 平台相关 optionalDependency 被静默跳过，随后 `biome check` 报 MODULE_NOT_FOUND。
          # --registry 会覆盖 lockfile 中的 resolved 主机，但不改动仓库里的 lockfile。
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          # 校验平台二进制确实落地，否则后续 biome 步骤会以难懂的方式失败
          node -e "require.resolve('@biomejs/cli-linux-x64/biome')" || {
            echo "::error::@biomejs/cli-linux-x64 缺失，npm ci 未正确安装平台依赖"
            exit 1
          }

      - name: Run Biome check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build extensions
        run: SKIP_BUMP=1 npm run build

      - name: Resolve Chrome for Testing version
        id: chrome-version
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from "node:fs/promises";
          const response = await fetch("https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json", {
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`无法读取 Chrome 测试版版本：HTTP ${response.status}`);
          const version = (await response.json()).channels?.Stable?.version;
          if (!/^\d+\.\d+\.\d+\.\d+$/.test(version ?? "")) throw new Error("Chrome 测试版版本格式无效");
          await appendFile(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`Chrome for Testing（测试版浏览器）：${version}`);
          JS

      - name: Setup Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          # 四段版本从官方测试版下载；stable 通道会安装忽略 --load-extension 的普通 Chrome。
          chrome-version: ${{ steps.chrome-version.outputs.version }}

      - name: Run isolated browser smoke tests
        env:
          CHROME_E2E_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:browser-smoke -- chrome

      # Firefox：必须用开发者版/Nightly。测试脚本通过 xpinstall.signatures.required=false
      # 加载未签名 XPI，release 版会忽略该偏好导致扩展装不上、冒烟必然失败。
      - name: Setup Firefox Developer Edition
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-devedition

      - name: Run Firefox smoke tests
        env:
          FIREFOX_E2E_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          # 脚本用 zip 把扩展打成未签名 XPI 塞进临时 profile
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zip
          fi
          "$FIREFOX_E2E_BINARY" --version
          npm run test:browser-smoke -- firefox

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: |
            dist/chrome.zip
            dist/firefox.zip
            dist/safari.zip
          if-no-files-found: error
