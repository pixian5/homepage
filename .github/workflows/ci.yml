name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Biome check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build extensions
        run: SKIP_BUMP=1 npm run build

      - name: Setup Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run isolated browser smoke tests
        env:
          CHROME_E2E_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:browser-smoke -- chrome

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: |
            dist/chrome.zip
            dist/firefox.zip
            dist/safari.zip
          if-no-files-found: error
